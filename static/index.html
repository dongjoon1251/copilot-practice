<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <main class="calculator">
    <div class="display">
      <div id="expression" class="expression"></div>
      <div id="result" class="result">0</div>
    </div>
    <div class="keypad">
      <button class="key key-memory" data-action="memory-clear">MC</button>
      <button class="key key-memory" data-action="memory-recall">MR</button>
      <button class="key key-memory" data-action="memory-add">M+</button>
      <button class="key key-memory" data-action="memory-subtract">M-</button>

      <button class="key key-clear" data-action="clear">AC</button>
      <button class="key key-clear" data-action="backspace">⌫</button>
      <button class="key key-op" data-value="%">%</button>
      <button class="key key-op" data-value="/">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key key-op" data-value="*">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key key-op" data-value="-">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key key-op" data-value="+">+</button>

      <button class="key key-zero" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key key-op" data-value="(">(</button>
      <button class="key key-op" data-value=")">)</button>
      <button class="key key-equals" data-action="equals">=</button>
    </div>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
